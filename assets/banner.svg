<svg class="study-art" id="coral-cutouts" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="s2-title s2-desc">
      <title id="s2-title">Coral cutouts</title>
      <desc id="s2-desc">Coral sky, oversized cream cloud, ochre sunlight, purple angular hills and a large turquoise curling wave, composed as flat abstract paper shapes. The wave and clouds drift slowly.</desc>
      <style>
        #coral-cutouts .s2-wave { animation: s2-roll 9s ease-in-out infinite; }
        #coral-cutouts .s2-cloud { animation: s2-cloud 17s ease-in-out infinite; }
        #coral-cutouts .s2-light { transform-origin: 841px 15px; animation: s2-light 13s ease-in-out infinite; }
        @keyframes s2-roll { 0%,100% { transform: translate(0,0); } 50% { transform: translate(8px,3px); } }
        @keyframes s2-cloud { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-10px); } }
        @keyframes s2-light { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(2deg); } }
        @media (prefers-reduced-motion: reduce) { #coral-cutouts .motion { animation: none !important; } }
      </style>
      <defs><clipPath id="s2-clip"><rect width="1200" height="400"/></clipPath></defs>

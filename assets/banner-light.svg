<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">Rob Conery, morning off Waikīkī</title>
  <desc id="d">A breaking wave drawn to today's buoy reading. South shore buoy: 3.6 ft swell at 12 s from the SSE. Sunset 6:19 pm HST</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6fb"/>
      <stop offset="0.55" stop-color="#dff3fc"/>
      <stop offset="0.86" stop-color="#fde7b2"/>
      <stop offset="1" stop-color="#fff3c4"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bae6fd" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="420" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#sky)"/>
    
    <g opacity="0.85"><animateTransform attributeName="transform" type="translate" values="0 0;18 0;0 0" dur="40s" repeatCount="indefinite"/><ellipse cx="720" cy="70" rx="60" ry="14" fill="#ffffff"/><ellipse cx="690" cy="74" rx="36" ry="11" fill="#ffffff"/><ellipse cx="754" cy="75" rx="40" ry="10" fill="#ffffff"/></g><g opacity="0.85"><animateTransform attributeName="transform" type="translate" values="0 0;18 0;0 0" dur="55s" repeatCount="indefinite"/><ellipse cx="1010" cy="120" rx="42" ry="9.799999999999999" fill="#ffffff"/><ellipse cx="989" cy="122.8" rx="25.2" ry="7.699999999999999" fill="#ffffff"/><ellipse cx="1033.8" cy="123.5" rx="28" ry="7" fill="#ffffff"/></g><g opacity="0.85"><animateTransform attributeName="transform" type="translate" values="0 0;18 0;0 0" dur="48s" repeatCount="indefinite"/><ellipse cx="240" cy="60" rx="36" ry="8.4" fill="#ffffff"/><ellipse cx="222" cy="62.4" rx="21.599999999999998" ry="6.6" fill="#ffffff"/><ellipse cx="260.4" cy="63" rx="24" ry="6" fill="#ffffff"/></g>
    
  <radialGradient id="sunglow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffd166" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
  </radialGradient>
  <circle cx="860" cy="150" r="108.80000000000001" fill="url(#sunglow)">
    <animate attributeName="r" values="102;119;102" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="860" cy="150" r="34" fill="#fff1a8"/>
    <polygon points="760,300 830,286 880,262 925,246 955,236 985,231 1010,233 1040,240 1075,238 1110,246 1150,262 1200,282 1200,300" fill="#3f5a4a"/>

    <!-- sea -->
    <rect x="0" y="300" width="1200" height="120" fill="url(#water)"/>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;-80 0" dur="10s" repeatCount="indefinite"/><path d="M-80 318 q20 -4 40 0 t40 0 q20 -4 40 0 t40 0 q20 -4 40 0 t40 0 q20 -4 40 0 t40 0 q20 -4 40 0 t40 0 q20 -4 40 0 t40 0 q20 -4 40 0 t40 0 q20 -4 40 0 t40 0 q20 -4 40 0 t40 0 q20 -4 40 0 t40 0 q20 -4 40 0 t40 0 q20 -4 40 0 t40 0 q20 -4 40 0 t40 0 q20 -4 40 0 t40 0 q20 -4 40 0 t40 0 q20 -4 40 0 t40 0 q20 -4 40 0 t40 0 q20 -4 40 0 t40 0" fill="none" stroke="#ffffff" stroke-width="1.20" opacity="0.28"/><path d="M-80 334 q20 -5 40 0 t40 0 q20 -5 40 0 t40 0 q20 -5 40 0 t40 0 q20 -5 40 0 t40 0 q20 -5 40 0 t40 0 q20 -5 40 0 t40 0 q20 -5 40 0 t40 0 q20 -5 40 0 t40 0 q20 -5 40 0 t40 0 q20 -5 40 0 t40 0 q20 -5 40 0 t40 0 q20 -5 40 0 t40 0 q20 -5 40 0 t40 0 q20 -5 40 0 t40 0 q20 -5 40 0 t40 0 q20 -5 40 0 t40 0 q20 -5 40 0 t40 0 q20 -5 40 0 t40 0" fill="none" stroke="#ffffff" stroke-width="1.08" opacity="0.25"/><path d="M-80 350 q20 -6 40 0 t40 0 q20 -6 40 0 t40 0 q20 -6 40 0 t40 0 q20 -6 40 0 t40 0 q20 -6 40 0 t40 0 q20 -6 40 0 t40 0 q20 -6 40 0 t40 0 q20 -6 40 0 t40 0 q20 -6 40 0 t40 0 q20 -6 40 0 t40 0 q20 -6 40 0 t40 0 q20 -6 40 0 t40 0 q20 -6 40 0 t40 0 q20 -6 40 0 t40 0 q20 -6 40 0 t40 0 q20 -6 40 0 t40 0 q20 -6 40 0 t40 0 q20 -6 40 0 t40 0" fill="none" stroke="#ffffff" stroke-width="0.96" opacity="0.22"/><path d="M-80 366 q20 -7 40 0 t40 0 q20 -7 40 0 t40 0 q20 -7 40 0 t40 0 q20 -7 40 0 t40 0 q20 -7 40 0 t40 0 q20 -7 40 0 t40 0 q20 -7 40 0 t40 0 q20 -7 40 0 t40 0 q20 -7 40 0 t40 0 q20 -7 40 0 t40 0 q20 -7 40 0 t40 0 q20 -7 40 0 t40 0 q20 -7 40 0 t40 0 q20 -7 40 0 t40 0 q20 -7 40 0 t40 0 q20 -7 40 0 t40 0 q20 -7 40 0 t40 0 q20 -7 40 0 t40 0" fill="none" stroke="#ffffff" stroke-width="0.84" opacity="0.19"/><path d="M-80 382 q20 -8 40 0 t40 0 q20 -8 40 0 t40 0 q20 -8 40 0 t40 0 q20 -8 40 0 t40 0 q20 -8 40 0 t40 0 q20 -8 40 0 t40 0 q20 -8 40 0 t40 0 q20 -8 40 0 t40 0 q20 -8 40 0 t40 0 q20 -8 40 0 t40 0 q20 -8 40 0 t40 0 q20 -8 40 0 t40 0 q20 -8 40 0 t40 0 q20 -8 40 0 t40 0 q20 -8 40 0 t40 0 q20 -8 40 0 t40 0 q20 -8 40 0 t40 0 q20 -8 40 0 t40 0" fill="none" stroke="#ffffff" stroke-width="0.72" opacity="0.16"/><path d="M-80 398 q20 -9 40 0 t40 0 q20 -9 40 0 t40 0 q20 -9 40 0 t40 0 q20 -9 40 0 t40 0 q20 -9 40 0 t40 0 q20 -9 40 0 t40 0 q20 -9 40 0 t40 0 q20 -9 40 0 t40 0 q20 -9 40 0 t40 0 q20 -9 40 0 t40 0 q20 -9 40 0 t40 0 q20 -9 40 0 t40 0 q20 -9 40 0 t40 0 q20 -9 40 0 t40 0 q20 -9 40 0 t40 0 q20 -9 40 0 t40 0 q20 -9 40 0 t40 0 q20 -9 40 0 t40 0" fill="none" stroke="#ffffff" stroke-width="0.60" opacity="0.13"/><path d="M-80 414 q20 -10 40 0 t40 0 q20 -10 40 0 t40 0 q20 -10 40 0 t40 0 q20 -10 40 0 t40 0 q20 -10 40 0 t40 0 q20 -10 40 0 t40 0 q20 -10 40 0 t40 0 q20 -10 40 0 t40 0 q20 -10 40 0 t40 0 q20 -10 40 0 t40 0 q20 -10 40 0 t40 0 q20 -10 40 0 t40 0 q20 -10 40 0 t40 0 q20 -10 40 0 t40 0 q20 -10 40 0 t40 0 q20 -10 40 0 t40 0 q20 -10 40 0 t40 0 q20 -10 40 0 t40 0" fill="none" stroke="#ffffff" stroke-width="0.48" opacity="0.10"/></g>

    <!-- the wave, breathing slightly like a set rolling through -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="6s" repeatCount="indefinite"/>
      <path d="M0 300 C120 294 240 290 340 265.4 C400 241.2 440 230.8 480 230.8 C545 230.8 572 248.8 548 264.0 C528 275.1 560 279.2 630 290.3 C780 304 980 296 1200 300 L1200 420 L0 420 Z" fill="url(#water)"/>
      <path d="M360 268.2 C410 246.0 445 235.6 480 235.6 C535 235.6 556 250.2 540 262.6 C500 265.4 440 268.2 400 279.2 C390 279.2 370 272.3 360 268.2 Z" fill="url(#face)"/>
      <path d="M548 265.4 C600 279.2 660 293.1 760 302 C700 314 600 312 548 279.2 Z" fill="#ffffff" opacity="0.55" filter="url(#soft)"/>
      <g transform="translate(534 279.2)">
    <animateTransform attributeName="transform" type="translate" values="534 279.2;540 282.2;534 279.2" dur="6s" repeatCount="indefinite"/>
    <g transform="rotate(-8)">
      <!-- board -->
      <path d="M-22 6 Q0 1 24 4 Q0 10 -22 6 Z" fill="#0f172a"/>
      <!-- legs -->
      <path d="M-6 4 L-3 -6 M6 4 L3 -6" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <!-- body, leaning forward -->
      <path d="M0 -6 L4 -17" stroke="#0f172a" stroke-width="2.8" stroke-linecap="round"/>
      <!-- arms out for balance -->
      <path d="M4 -14 L-6 -18 M4 -14 L14 -11" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <!-- head -->
      <circle cx="5.5" cy="-21" r="3.4" fill="#0f172a"/>
    </g>
  </g>
      <path d="M352 264.0 C405 240.5 442 230.1 480 230.1 C546 230.1 574 248.1 549 264.0" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.95" filter="url(#glow)"/>
    </g>

    <!-- name -->
    <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="64" y="118" font-size="66" font-weight="800" fill="#0f172a" letter-spacing="-1.5">Rob Conery</text>
      <text x="66" y="156" font-size="22" font-weight="500" fill="#7c2d12">Honolulu · Postgres · AI · books, video, and shipping things</text>
      <text x="64" y="394" font-size="16" fill="#e0f2fe" opacity="0.95">South shore buoy: 3.6 ft swell at 12 s from the SSE</text>
      <text x="1136" y="394" font-size="16" fill="#e0f2fe" opacity="0.95" text-anchor="end">Sunset 6:19 pm HST · Oct 2, 11:58 am HST</text>
    </g>
  </g>
</svg>
